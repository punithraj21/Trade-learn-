<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Steep vs. shallow trendline</text>
  <text x="20" y="44" font-size="12" fill="#52514e">A very steep line gets broken almost immediately; a shallower line holds and stays useful longer</text>
  <g transform="translate(0, 44)"><line x1="44" y1="8.0" x2="620" y2="8.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="59.0" x2="620" y2="59.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="110.0" x2="620" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="161.0" x2="620" y2="161.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#c3c2b7" stroke-width="1"/><text x="44.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Start</text><text x="620.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Now</text><path d="M 44.0 187.0 L 159.2 155.1 L 274.4 123.3 L 389.6 91.4 L 504.8 59.6 L 620.0 27.7" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="626.0" y="27.7" font-size="10" fill="#184f95">Steep line (breaks fast)</text><path d="M 44.0 192.3 L 159.2 187.0 L 274.4 181.6 L 389.6 176.3 L 504.8 171.0 L 620.0 165.7" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><text x="626.0" y="165.7" font-size="10" fill="#a8471f">Shallow line (holds)</text><path d="M 44.0 181.6 L 159.2 171.0 L 274.4 176.3 L 389.6 160.4 L 504.8 155.1 L 620.0 141.8" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>