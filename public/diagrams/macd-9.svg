<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Ignoring the Zero Line</text>
  <text x="20" y="44" font-size="12" fill="#52514e">A crossover far below zero is weaker than one that also pushes above zero.</text>
  <g transform="translate(0, 44)"><line x1="44" y1="8.0" x2="620" y2="8.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="59.0" x2="620" y2="59.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="110.0" x2="620" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="161.0" x2="620" y2="161.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="55.2" x2="620" y2="55.2" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50.0" y="51.2" font-size="10" text-anchor="start" fill="#898781">Zero line</text><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#c3c2b7" stroke-width="1"/><text x="44.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Day 1</text><text x="620.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Day 5</text><text x="332.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Day 3</text><path d="M 44.0 151.1 L 188.0 151.1 L 332.0 144.3 L 476.0 123.7 L 620.0 89.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="626.0" y="89.4" font-size="10" fill="#184f95">Signal line</text><path d="M 44.0 192.3 L 188.0 164.8 L 332.0 130.6 L 476.0 96.3 L 620.0 27.7" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="332.0" cy="130.6" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="332.0" y="120.6" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Crossover, still below zero (weaker)</text><circle cx="620.0" cy="27.7" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="620.0" y="17.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Now above zero too (stronger)</text></g>
