  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Trailing stop: the stop follows price up, never down</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Illustrative — as price climbs, the stop is raised in steps to lock in profit</text>
