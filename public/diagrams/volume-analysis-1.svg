<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Volume bar height shows crowd size</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Volume bars sit below the price chart — a tall bar means many shares traded, a short bar means few</text>
  <g transform="translate(0, 44)"><line x1="20" y1="180.0" x2="460" y2="180.0" stroke="#c3c2b7" stroke-width="1.5"/><rect x="118.0" y="20.0" width="24.0" height="160.0" fill="#2a78d6" rx="4"/><text x="130.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">85</text><text x="130.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Busy day — many traders</text><rect x="338.0" y="142.4" width="24.0" height="37.6" fill="#2a78d6" rx="4"/><text x="350.0" y="134.4" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">20</text><text x="350.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Quiet day — few traders</text></g>
</svg>