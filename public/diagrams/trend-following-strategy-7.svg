<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Breaking Your Own Rules</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Moving the stop lower to avoid a loss often creates a bigger one</text>
  <g transform="translate(0, 44)"><line x1="44" y1="8.0" x2="620" y2="8.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="59.0" x2="620" y2="59.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="110.0" x2="620" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="161.0" x2="620" y2="161.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="86.5" x2="620" y2="86.5" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50.0" y="82.5" font-size="10" text-anchor="start" fill="#898781">Planned stop (below swing low)</text><line x1="44" y1="145.3" x2="620" y2="145.3" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="50.0" y="141.3" font-size="10" text-anchor="start" fill="#898781">Stop moved lower (rule broken)</text><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#c3c2b7" stroke-width="1"/><text x="44.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Entry</text><text x="620.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Keeps falling</text><path d="M 44.0 27.7 L 236.0 80.6 L 428.0 115.9 L 620.0 192.3" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44.0" cy="27.7" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="44.0" y="17.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Entry</text><circle cx="620.0" cy="192.3" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="620.0" y="210.3" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Bigger loss than planned</text></g>
</svg>