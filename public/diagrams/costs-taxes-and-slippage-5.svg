<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Ravi's trade: raw profit minus costs</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Buys shares for ₹10,000, sells for ₹10,300 the same week</text>
  <g transform="translate(0, 44)"><line x1="20" y1="161.2" x2="460" y2="161.2" stroke="#c3c2b7" stroke-width="1.5"/><rect x="52.0" y="20.0" width="24.0" height="141.2" fill="#0ca30c" rx="4"/><text x="64.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">+₹300</text><text x="64.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Raw profit</text><rect x="140.0" y="161.2" width="24.0" height="18.8" fill="#d03b3b" rx="4"/><text x="152.0" y="192.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">-₹40</text><text x="152.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Brokerage (both ways)</text><rect x="228.0" y="161.2" width="24.0" height="11.8" fill="#d03b3b" rx="4"/><text x="240.0" y="188.9" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">-₹25</text><text x="240.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">STT + exchange + GST</text><rect x="316.0" y="161.2" width="24.0" height="4.7" fill="#d03b3b" rx="4"/><text x="328.0" y="181.9" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">-₹10</text><text x="328.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Stamp duty + DP</text><rect x="404.0" y="55.3" width="24.0" height="105.9" fill="#0ca30c" rx="4"/><text x="416.0" y="47.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">₹225</text><text x="416.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Real profit</text></g>
