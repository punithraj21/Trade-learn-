<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Zone Strength Fades With Each Test</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Untested zones are strongest; after 2–3 tests, treat a zone as tired.</text>
  <g transform="translate(0, 44)"><line x1="20" y1="180.0" x2="460" y2="180.0" stroke="#c3c2b7" stroke-width="1.5"/><rect x="63.0" y="20.0" width="24.0" height="160.0" fill="#0ca30c" rx="4"/><text x="75.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Strong</text><text x="75.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Fresh (0 tests)</text><rect x="173.0" y="68.0" width="24.0" height="112.0" fill="#2a78d6" rx="4"/><text x="185.0" y="60.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Weaker</text><text x="185.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">After test 1</text><rect x="283.0" y="116.0" width="24.0" height="64.0" fill="#2a78d6" rx="4"/><text x="295.0" y="108.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Weak</text><text x="295.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">After test 2</text><rect x="393.0" y="156.0" width="24.0" height="24.0" fill="#d03b3b" rx="4"/><text x="405.0" y="148.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Tired</text><text x="405.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">After test 3</text></g>
</svg>