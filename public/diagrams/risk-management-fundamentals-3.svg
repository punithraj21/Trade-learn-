<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">The maths of drawdown</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Bigger losses need disproportionately bigger gains to recover</text>
  <g transform="translate(0, 44)"><line x1="20" y1="126.7" x2="460" y2="126.7" stroke="#c3c2b7" stroke-width="1.5"/><rect x="63.0" y="126.7" width="24.0" height="10.7" fill="#d03b3b" rx="4"/><text x="75.0" y="153.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">-10%</text><text x="75.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Lose 10%</text><rect x="173.0" y="114.9" width="24.0" height="11.7" fill="#0ca30c" rx="4"/><text x="185.0" y="106.9" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">+11%</text><text x="185.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Gain to recover</text><rect x="283.0" y="126.7" width="24.0" height="53.3" fill="#d03b3b" rx="4"/><text x="295.0" y="192.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">-50%</text><text x="295.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Lose 50%</text><rect x="393.0" y="20.0" width="24.0" height="106.7" fill="#0ca30c" rx="4"/><text x="405.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">+100%</text><text x="405.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Gain to recover</text></g>
</svg>