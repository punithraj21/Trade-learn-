<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="419" height="319" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Reading a Red Candle Correctly</text>
  <text x="20" y="44" font-size="12" fill="#52514e">On a bearish candle the top of the body is the open, not the close</text>
  <g transform="translate(0, 44)"><line x1="150.0" y1="52.7" x2="150.0" y2="183.3" stroke="#d03b3b" stroke-width="2"/><rect x="122.0" y="78.8" width="56" height="78.4" fill="#d03b3b" stroke="#d03b3b" stroke-width="2" rx="2"/><line x1="178.0" y1="52.7" x2="188.0" y2="52.7" stroke="#898781" stroke-width="1"/>
      <text x="196.0" y="56.7" font-size="11" text-anchor="start" fill="#52514e">High — 68</text><line x1="178.0" y1="183.3" x2="188.0" y2="183.3" stroke="#898781" stroke-width="1"/>
      <text x="196.0" y="187.3" font-size="11" text-anchor="start" fill="#52514e">Low — 48</text><line x1="122.0" y1="78.8" x2="112.0" y2="78.8" stroke="#898781" stroke-width="1"/>
      <text x="104.0" y="82.8" font-size="11" text-anchor="end" fill="#52514e">Open — 64</text><line x1="122.0" y1="157.2" x2="112.0" y2="157.2" stroke="#898781" stroke-width="1"/>
      <text x="104.0" y="161.2" font-size="11" text-anchor="end" fill="#52514e">Close — 52</text><rect x="100" y="233" width="14" height="11" rx="1.5" fill="#d03b3b" stroke="#d03b3b" stroke-width="1.5"/><text x="120" y="242" font-size="10.5" fill="#898781">Body (filled = down)</text><line x1="257" y1="233" x2="257" y2="244" stroke="#d03b3b" stroke-width="1.5"/><text x="270" y="242" font-size="10.5" fill="#898781">Wick = high/low reach</text></g>
</svg>