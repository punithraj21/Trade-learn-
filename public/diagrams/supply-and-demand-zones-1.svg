<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Demand Zone: A Wall of Buyers</text>
  <text x="20" y="44" font-size="12" fill="#52514e">A quiet base, then a fast move up; buyers return later and price bounces again.</text>
  <g transform="translate(0, 44)"><line x1="44" y1="8.0" x2="620" y2="8.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="59.0" x2="620" y2="59.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="110.0" x2="620" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="161.0" x2="620" y2="161.0" stroke="#e1e0d9" stroke-width="1"/><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#e1e0d9" stroke-width="1"/><rect x="44" y="176.6" width="576" height="15.7" fill="#2a78d6" fill-opacity="0.10"/><text x="614" y="188.6" font-size="10" text-anchor="end" fill="#898781">Demand zone</text><line x1="44" y1="212.0" x2="620" y2="212.0" stroke="#c3c2b7" stroke-width="1"/><text x="44.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Day 1</text><text x="620.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Bounce</text><text x="332.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Breakout</text><text x="524.0" y="232" font-size="10" text-anchor="middle" fill="#898781">Return</text><path d="M 44.0 176.6 L 140.0 192.3 L 236.0 184.4 L 332.0 27.7 L 428.0 86.5 L 524.0 180.5 L 620.0 74.7" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="332.0" cy="27.7" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="332.0" y="17.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Fast move up</text><circle cx="524.0" cy="180.5" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="524.0" y="198.5" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Price returns to zone</text><circle cx="620.0" cy="74.7" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="620.0" y="64.7" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Bounces off zone (support)</text></g>
</svg>