<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Grade the decision, not the outcome</text>
  <text x="20" y="44" font-size="12" fill="#52514e">A good decision can still lose; a bad one can still win</text>
  <g transform="translate(0, 44)"><line x1="20" y1="100.0" x2="460" y2="100.0" stroke="#c3c2b7" stroke-width="1.5"/><rect x="118.0" y="100.0" width="24.0" height="80.0" fill="#d03b3b" rx="4"/><text x="130.0" y="192.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Loss</text><text x="130.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Followed the plan → good trade</text><rect x="338.0" y="20.0" width="24.0" height="80.0" fill="#0ca30c" rx="4"/><text x="350.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Win</text><text x="350.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Broke the rules → bad trade</text></g>
</svg>