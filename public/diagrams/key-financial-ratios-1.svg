<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="479" height="279" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Benchmarks this chapter uses</text>
  <text x="20" y="44" font-size="12" fill="#52514e">Each ratio is its own health-check number — not comparable to the others by height</text>
  <g transform="translate(0, 44)"><line x1="20" y1="180.0" x2="460" y2="180.0" stroke="#c3c2b7" stroke-width="1.5"/><rect x="81.3" y="169.3" width="24.0" height="10.7" fill="#2a78d6" rx="4"/><text x="93.3" y="161.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Below 1 = can look cheap</text><text x="93.3" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">P/B</text><rect x="228.0" y="20.0" width="24.0" height="160.0" fill="#2a78d6" rx="4"/><text x="240.0" y="12.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Above 15% = often healthy</text><text x="240.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">ROE</text><rect x="374.7" y="169.3" width="24.0" height="10.7" fill="#2a78d6" rx="4"/><text x="386.7" y="161.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Below 1 = usually comfortable</text><text x="386.7" y="204.0" font-size="10.5" text-anchor="middle" fill="#52514e">Debt-to-Equity</text></g>
</svg>